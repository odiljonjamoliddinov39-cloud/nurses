# Run from repo root: docker compose -f infra/docker-compose.yml --env-file .env up --build
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: nurses, POSTGRES_PASSWORD: nurses, POSTGRES_DB: nurses }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nurses"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  minio:  # S3-compatible storage for local dev (use Cloudflare R2 in production)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
  backend:
    build: ../backend
    env_file: ../.env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
  worker:
    build: ../backend
    command: arq app.workers.tasks.WorkerSettings
    env_file: ../.env
    depends_on: [backend]
  bot:
    build: ../bot
    env_file: ../.env
    depends_on: [backend]
  miniapp:
    build: ../miniapp
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
    ports: ["5173:5173"]
  admin:
    build: ../admin
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
    ports: ["5174:5174"]
volumes:
  pgdata:
  miniodata:
